<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciclo de Gestão e Desenvolvimento de Competências | umgrauemeio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;family=Raleway:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#151515; --paper:#F0EFEF; --red:#DC3333; --amber:#F9A522;
  --card:#FFFFFF; --ink2:#3a3a3a; --muted:#6f6d6d; --line:#dcdada; --soft:#e6e4e4;
  --red-soft:#fbe6e6; --amber-soft:#fef1dc; --ink-soft:#e9e9e9;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55}
h1,h2,h3,h4{font-family:Raleway,Montserrat,sans-serif;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.side{background:var(--ink);color:var(--paper);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:10px;padding:4px 8px 14px;border-bottom:1px solid #2c2c2c}
.brand img{width:92px;height:auto}
.brand small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a9a7a7}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8d8b8b;margin:12px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:#d9d7d7;font-size:13px;font-weight:500}
.nav a:hover{background:#232323;color:#fff}
.nav a.on{background:#262626;color:#fff;box-shadow:inset 3px 0 0 var(--red)}
.nav .n{width:22px;height:22px;border-radius:50%;border:1.5px solid #5a5858;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.nav a.on .n{border-color:var(--red);color:#fff}
.nav .st{margin-left:auto;white-space:nowrap;flex:none;font-size:10px;padding:1px 7px;border-radius:20px;background:#2b2b2b;color:#9b9999;font-weight:600}
.nav .st.ok{background:var(--red);color:#fff}
.side .foot{margin-top:auto;font-size:11px;color:#8d8b8b;padding:0 8px}
.sync{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:#777;display:inline-block}
.sync.ok i{background:#4caf50}.sync.local i{background:var(--amber)}

main{padding:30px 40px 60px;max-width:1240px;width:100%}
.crumb{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:6px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.pagehead h1{font-size:28px}
.pagehead p{margin:6px 0 0;color:var(--ink2);max-width:760px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--ink-soft);color:var(--ink2);white-space:nowrap}
.tag.red{background:var(--red-soft);color:#a32222}
.tag.amber{background:var(--amber-soft);color:#8a5800}
.tag.dark{background:var(--ink);color:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#000}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.red:hover{background:#c22a2a}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- overview ---------- */
.hero{background:var(--ink);color:var(--paper);border-radius:14px;padding:34px 36px;position:relative;overflow:hidden;margin-bottom:20px}
.hero h1{font-size:34px;line-height:1.12;max-width:640px}
.hero p{max-width:640px;color:#cfcdcd;margin:14px 0 0}
.hero .deg{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:34px solid var(--red);opacity:.95}
.hero .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:12px}
.pillar{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-top:3px solid var(--ink)}
.pillar b{font-family:Montserrat;font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--red);display:block}
.pillar span{font-weight:600;font-size:13.5px}
h2.sec{font-size:20px;margin:30px 0 4px}
p.secsub{margin:0 0 14px;color:var(--muted)}

.flow{display:grid;grid-template-columns:120px minmax(0,560px) 150px;grid-template-rows:repeat(9,auto);row-gap:10px;justify-content:center;margin-top:8px}
.step{grid-column:2;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer;position:relative;text-decoration:none;transition:border-color .15s, transform .15s}
.step:hover{border-color:var(--ink);transform:translateX(2px)}
.step:not(:last-of-type)::after{content:"";position:absolute;left:33px;bottom:-11px;width:2px;height:10px;background:var(--line)}
.step .num{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:Montserrat;font-weight:800;flex:none}
.step.done .num{background:var(--red)}
.step h4{font-size:14.5px}
.step small{color:var(--muted);font-size:12px}
.step .tag{margin-left:auto}
.loopL{grid-column:1;grid-row:3 / 10;border:2px solid var(--red);border-right:none;border-radius:12px 0 0 12px;margin:22px 0 22px 30px;position:relative}
.loopL span,.loopR span{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;line-height:1.25;background:var(--paper);padding:4px 0}
.loopL span{left:-30px;width:60px;text-align:center;color:var(--red)}
.loopR{grid-column:3;grid-row:6 / 9;border:2px solid var(--amber);border-left:none;border-radius:0 12px 12px 0;margin:22px 30px 22px 0;position:relative}
.loopR span{right:-30px;width:84px;text-align:center;color:#a36b00;right:-44px}
.legend-loop{display:flex;gap:18px;justify-content:center;margin-top:10px;font-size:12px;color:var(--muted)}
.legend-loop i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--ink)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child{font-weight:600}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.scale div{border-radius:10px;padding:14px;border:1px solid var(--line);background:var(--card)}
.scale b{font-family:Montserrat;font-weight:700;font-size:24px;display:block}
.scale .gap{border-top:4px solid var(--red)} .scale .op{border-top:4px solid var(--amber)} .scale .fo{border-top:4px solid var(--ink)}
.road{counter-reset:r;display:grid;gap:8px}
.road div{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.road div::before{counter-increment:r;content:counter(r);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.road div.now{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.road div.now::before{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- DC module ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;min-width:0}
.input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.search{flex:1;min-width:220px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:130px}
.stat b{font-family:Montserrat;font-weight:700;font-size:22px;display:block;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.dcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.dc:hover{border-color:var(--ink)}
.dc h4{font-size:14.5px;line-height:1.3}
.dc .area{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.ready{height:5px;background:var(--soft);border-radius:4px;overflow:hidden}
.ready i{display:block;height:100%;background:var(--red)}
.ready.full i{background:var(--ink)}

.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.dhead{background:var(--ink);color:#fff;border-radius:12px;padding:22px 24px;margin-bottom:16px}
.dhead h2{font-size:24px}
.dhead .kv{display:flex;gap:24px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:#cfcdcd}
.dhead .kv b{color:#fff;font-weight:600}
.block{margin-bottom:16px}
.block h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.block h3::before{content:"";width:10px;height:10px;background:var(--red);display:inline-block}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.resp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.resp li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.resp .grp{font-weight:700;font-size:12px;color:var(--red);margin:12px 0 2px;letter-spacing:.02em}
.pick{width:22px;height:22px;border-radius:6px;border:1.5px solid #bdbbbb;background:#fff;cursor:pointer;display:grid;place-items:center;font-size:12px;font-weight:800;padding:0;flex:none}
.pick.T{background:var(--ink);border-color:var(--ink);color:#fff}
.pick.C{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.comp td ul{margin:0;padding-left:16px}
.comp ul.hab{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.comp ul.hab li{display:flex;gap:8px;align-items:flex-start;margin:0}
.habrow td{background:#fffaf1}
.comp td li{margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--ink)}
.chip.C{background:var(--amber-soft);border-color:var(--amber)}
.chip.T{background:var(--ink);color:#fff;border-color:var(--ink)}
.diag{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.diag h3{font-size:15px}
.meter{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin:12px 0 4px}
.diag ol{margin:6px 0 0;padding-left:18px;font-size:12.5px}
.diag ol li{margin:4px 0}
.diag ol li button{border:none;background:none;color:var(--red);cursor:pointer;font-size:11px;padding:0 0 0 4px}
.hint{font-size:12px;color:var(--muted);background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:12px}
.addline{display:flex;gap:6px;margin-top:8px}
.addline input{flex:1}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(21,21,21,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
.modal.on{display:flex}
.mbox{background:var(--paper);border-radius:14px;width:min(980px,100%);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox h2{font-size:21px;margin-bottom:4px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
textarea.input{resize:vertical;min-height:70px;line-height:1.45}
.rlist{display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:1fr 120px 170px 32px;gap:6px;align-items:start}
.rrow textarea{min-height:84px}
.x{border:1px solid var(--line);background:#fff;border-radius:8px;height:36px;cursor:pointer;color:var(--red);font-weight:700}
.mfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}

/* ---------- placeholder stages ---------- */
.soon{border:1.5px dashed #c3c1c1;border-radius:12px;padding:20px;background:rgba(255,255,255,.5)}
.soon ul{margin:6px 0 0;padding-left:18px}
.io{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.io .card h4{font-size:13px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.roles .card{border-top:3px solid var(--ink)}
.roles .card:nth-child(2){border-top-color:var(--red)}
.roles .card:nth-child(3){border-top-color:var(--amber)}
.roles h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}

/* ---------- onboarding ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.pcard:hover{border-color:var(--ink)}
.pcard h4{font-size:15px}
.tl{position:relative;display:flex;justify-content:space-between;padding:0 4px;margin-top:4px}
.tlbar{position:absolute;left:14px;right:14px;top:8px;height:4px;background:var(--soft);border-radius:4px;z-index:0}
.tlbar b{display:block;height:100%;background:var(--ink);border-radius:4px}
.tlp{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700}
.tlp i{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #c7c5c5;display:block}
.tlp.done i,.tlp.concluido i{background:var(--ink);border-color:var(--ink)}
.tlp.avaliado i{background:var(--amber);border-color:var(--amber)}
.tlp.pendente i,.tlp.atrasado i{background:#fff;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.tlp.atrasado i{background:var(--red)}
.daytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.dtab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;border-top:4px solid #c7c5c5}
.dtab b{font-family:Montserrat;font-weight:700;font-size:14px}.dtab span{font-size:11.5px;color:var(--muted)}
.dtab.done{cursor:default;border-top-color:var(--ink);opacity:.75}
.dtab.concluido{border-top-color:var(--ink)}.dtab.avaliado{border-top-color:var(--amber)}.dtab.pendente,.dtab.atrasado{border-top-color:var(--red)}
.dtab.on{outline:2px solid var(--ink);outline-offset:-1px}
.rub{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.rub span{font-size:11px;background:var(--paper);border-radius:8px;padding:6px 8px;line-height:1.35}
.rub b{display:block;font-size:11.5px}
.obj{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.objh{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--paper);padding:9px 14px;font-weight:700;font-size:13px}
.item{padding:10px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr;gap:8px}
.itxt{font-size:13px}
.notas{display:flex;gap:4px;flex-wrap:wrap}
.nota{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
.nota:hover{border-color:var(--ink)}
.nota.on.n1,.nota.on.n2{background:var(--red);border-color:var(--red);color:#fff}
.nota.on.n3{background:var(--ink);border-color:var(--ink);color:#fff}
.nota.on.n4,.nota.on.n5{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.obs{font-size:12.5px;padding:6px 10px}
.sc{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px 0}
.item .sc{padding:0}
.obj > .sc{padding:12px 14px}
.scb{width:34px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:700;cursor:pointer}
.scb:hover{border-color:var(--ink)}
.scb.on.g{background:#1f8a4c;border-color:#1f8a4c;color:#fff}.scb.on.y{background:var(--amber);border-color:var(--amber)}.scb.on.r{background:var(--red);border-color:var(--red);color:#fff}
.big{font-family:Montserrat;font-weight:700;font-size:40px;line-height:1;margin:12px 0 6px;display:flex;flex-direction:column;gap:6px}
.big small{font-size:12px;font-weight:600;color:var(--muted)}
.big.ok{color:#1f8a4c}.big.mid{color:#c77700}.big.bad{color:var(--red)}
ol.mini{font-size:12px;padding-left:18px;margin:6px 0 0}
ol.mini li{margin:3px 0}
.prow{display:grid;grid-template-columns:1fr 32px;gap:6px;margin-bottom:6px}
.pponto{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;background:#fff}
@media (max-width:980px){ .daytabs{grid-template-columns:repeat(2,1fr)} .rub{grid-template-columns:1fr} .pgrid{grid-template-columns:1fr} }
/* ---------- diagnóstico ---------- */
.qbox{border:1px solid var(--line);border-left:4px solid #c7c5c5;border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#fff}
.qbox.ok{border-left-color:var(--ink)}
.altrow{display:grid;grid-template-columns:96px 1fr;gap:8px;margin-top:6px;align-items:start}
.altrow textarea{min-height:68px;font-size:12.5px}
.lvl{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;padding:6px 4px;font-weight:800;font-size:16px;color:#fff;min-height:46px;line-height:1.1}
.lvl small{font-size:10px;font-weight:600;text-align:center}
.lvl.l1,.lvl.l2{background:var(--red)}.lvl.l2{background:#e86a6a}.lvl.l3{background:var(--amber);color:var(--ink)}.lvl.l4{background:var(--ink)}
.occ{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.rrow2{display:grid;grid-template-columns:1fr auto 170px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
@media (max-width:980px){ .rrow2{grid-template-columns:1fr} .altrow{grid-template-columns:1fr} }
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lk{font-size:11.5px;background:var(--paper);border-radius:8px;padding:4px 6px 4px 8px;display:inline-flex;gap:6px;align-items:flex-start;max-width:100%}
.lk b{color:var(--red)}.lk button{border:none;background:none;color:var(--muted);cursor:pointer;padding:0;font-weight:700}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .detail{grid-template-columns:1fr}
  .diag{position:static}
  .g5{grid-template-columns:repeat(2,1fr)}
  .g3,.g2,.roles,.io,.scale{grid-template-columns:1fr}
  .flow{grid-template-columns:40px 1fr 40px}
  .loopL span,.loopR span{display:none}
  main{padding:22px 16px 50px}
  .rrow{grid-template-columns:1fr}
}

.swg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}.swg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.swq{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.swq h4{margin:0 0 6px;font-family:Raleway,sans-serif;display:flex;justify-content:space-between;gap:8px;align-items:baseline}.swq h4 small{font-family:Montserrat;font-weight:400;font-size:11px;color:var(--muted)}.swq ul{margin:0;padding-left:18px;font-size:13px}.swq li{margin:3px 0}
.swc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:10px;padding:14px 16px;margin-bottom:12px}.swc .f{margin-top:8px}
.chk{display:inline-flex;gap:5px;align-items:center;font-size:12px;background:var(--paper);border-radius:6px;padding:4px 8px;cursor:pointer}.chk small{color:var(--muted)}
.bars{display:inline-flex;gap:2px;vertical-align:middle}.bars i{width:10px;height:10px;display:block;border-radius:2px}
.input.sm{padding:5px 8px;font-size:12.5px}
@media(max-width:900px){.swg,.swg3{grid-template-columns:1fr}}
.f .chk{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;color:var(--ink)}.swc.cC{border-left-color:var(--red)}
.t td .btn{white-space:nowrap}

/* ---------- acesso (login / configuração) ---------- */
.gate{min-height:100vh;display:grid;place-items:center;background:var(--ink);padding:24px}
.gate .box{background:var(--paper);border-radius:16px;max-width:560px;width:100%;padding:30px 32px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.gate h1{font-size:24px;margin-bottom:6px}.gate p{color:var(--ink2)}
.gate .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:10px}
.gate .err{background:var(--red-soft);color:#8f1d1d;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
.gate ol{padding-left:18px}.gate li{margin:6px 0}
.backlink{display:block;margin-top:10px;color:#cfcdcd;font-size:12px;text-decoration:none}.backlink:hover{color:#fff}
</style>
</head>

<script type="text/plain" id="app-code">

const BASE = JSON.parse(document.getElementById('ugm-base').textContent);
let STATE = JSON.parse(document.getElementById('ugm-state').textContent);
let ART = {firestore:true};
let PENDING=false, PUBLISHING=false, _ver=0, _saved=0, _saveT=null;
function syncUI(){
  const el=document.getElementById('sync'); if(!el) return;
  if(PUBLISHING){ el.className='sync local'; el.innerHTML='<i></i><span>Salvando…</span>'; return; }
  if(PENDING){ el.className='sync local'; el.innerHTML='<i></i><span>Alterações não salvas</span> <button class="btn red sm" id="bSync" style="margin-top:8px">Salvar agora</button>'; document.getElementById('bSync').onclick=publishNow; }
  else { el.className='sync ok'; el.innerHTML='<i></i><span>Tudo salvo no banco · '+esc(window.CICLO_USER||'')+'</span>'; }
  document.querySelectorAll('.bSaveInline').forEach(b=>{ b.disabled=!PENDING; b.textContent=PENDING?'Salvar marcações':'Marcações salvas'; });
}
const VIEW_KEY='ugm-ciclo-view';
function saveView(){ try{ sessionStorage.setItem(VIEW_KEY, JSON.stringify({hash:location.hash, y:window.scrollY, nivel:VIEW.nivel, day:VIEW.day, ts:Date.now()})); }catch(e){} }
function loadView(){ try{ const v=JSON.parse(sessionStorage.getItem(VIEW_KEY)||'null'); sessionStorage.removeItem(VIEW_KEY); return v&&Date.now()-v.ts<120000?v:null; }catch(e){ return null; } }
// cada alteração é gravada no banco (Firestore) automaticamente, ~1 segundo depois
function persist(){
  STATE.atualizado=new Date().toISOString(); _ver++;
  PENDING=true; syncUI(); clearTimeout(_saveT); _saveT=setTimeout(publishNow,1200);
}
async function publishNow(){
  if(!PENDING||PUBLISHING) return;
  PUBLISHING=true; syncUI(); const v=_ver;
  try{ await window.CicloDB.saveState(STATE); _saved=v; }
  catch(e){ console.error(e); toast('Não foi possível salvar: '+((e&&(e.code||e.message))||'erro')); }
  PUBLISHING=false; PENDING=_saved<_ver; syncUI();
  if(PENDING && _saved===v){ clearTimeout(_saveT); _saveT=setTimeout(publishNow,1200); }
}
window.addEventListener('beforeunload',e=>{ if(PENDING||PUBLISHING){ e.preventDefault(); e.returnValue=''; } });

/* ============ migrações (ajustes pontuais aplicados uma única vez sobre o estado salvo) ============ */
const MIGRACOES=[];
(function(){ STATE.migracoes=STATE.migracoes||[]; let mudou=false;
  MIGRACOES.forEach(m=>{ if(!STATE.migracoes.includes(m.id)){ try{ m.run(STATE); STATE.migracoes.push(m.id); mudou=true; }catch(e){} } });
  if(mudou){ STATE.atualizado=new Date().toISOString(); lsSet(STATE); PENDING=true; }
})();
function serializeState(s){ const j=v=>JSON.stringify(v).replace(/</g,'\\u003c');
  return '{\n'+Object.keys(s).map(k=>{ const v=s[k]; if(v&&typeof v==='object'&&!Array.isArray(v)&&['questoes','onboarding','diagRespostas','diagnostico','dcs','pessoas'].includes(k)) return j(k)+':{\n'+Object.keys(v).map(kk=>j(kk)+':'+j(v[kk])).join(',\n')+'\n}'; return j(k)+':'+j(v); }).join(',\n')+'\n}'; }

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2200); }
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const titleCase=s=>{ const small=['de','da','do','das','dos','e','em']; return s.toLowerCase().replace(/(^|\s|\()([\wÀ-ÿ]+)/g,(m,p,w)=> p+(small.includes(w)&&p!==''?w:w.charAt(0).toUpperCase()+w.slice(1))).replace(/\b(Rh|Sig|Kam|Sdr|Faaas|Jr|Ti)\b/g,x=>x.toUpperCase()); };
const AREA_FIX={'RECURSOS HUMANOS':'Gente & Cultura','RH':'Gente & Cultura','OPERAÇOES':'Operações','ADM/FINANCEIRO':'Administrativo/Financeiro','ADM. FINANCEIRA':'Administrativo/Financeiro','FINANCEIRO':'Administrativo/Financeiro'};
const normArea=a=>{ const u=(a||'').trim().toUpperCase(); return AREA_FIX[u]||titleCase(u||'Sem área'); };

/* ============ Quadro atual (cargos x DC) ============ */
// Cargo atual -> DC vigente (validado por GC em 23/11/2026). Níveis dos ocupantes: JR, PL, SR ou '' (cargo sem nível).
const QUADRO={
 'Técnico Especialista em Transmissão':{nome:'Técnico Especialista em Transmissão',occ:['JR']},
 'Assistente Financeiro':{nome:'Assistente Financeiro',occ:['JR']},
 'Analista de Assistência Técnica':{nome:'Analista de Assistência Técnica',occ:['SR','SR','PL']},
 'Consultor Técnico de Vendas':{nome:'Consultor Técnico de Vendas',occ:['JR','SR','SR']},
 'Analista de Suporte Técnico':{nome:'Analista de Suporte Técnico',occ:['SR','PL','PL','PL','JR']},
 'Advogado':{nome:'Advogado',occ:['JR']},
 'Supervisor de Suporte Técnico':{nome:'Supervisor de Suporte Técnico',occ:['JR']},
 'Técnico em Planejamento de Manutenção':{nome:'Técnico em Planejamento de Manutenção',occ:['JR']},
 'Analista de Sistemas':{nome:'Analista de Sistemas',occ:['JR']},
 'Analista de Implantação de Projetos':{nome:'Analista de Implantação de Projetos',occ:['JR']},
 'Líder de Suprimentos':{nome:'Líder de Suprimentos',occ:['JR']},
 'Analista de Projetos':{nome:'Analista de Projetos',occ:['JR','JR']},
 'SDR Assistent':{nome:'SDR Assistant',occ:['SR']},
 'Analista de RH':{nome:'Analista de Gente & Cultura',area:'Gente & Cultura',occ:['JR']},
 'Assistente de Diretoria':{nome:'Assistente de Diretoria',occ:['JR']},
 'Assistente de Logística':{nome:'Assistente de Suprimentos',occ:['JR']},
 'Assistente de Suporte Técnico':{nome:'Assistente de Suporte Técnico',occ:['PL']},
 'Analista de Sucesso do Cliente':{nome:'Analista de Sucesso do Cliente',occ:['JR','PL','PL']},
 'Assistente de Implantação de Projetos':{nome:'Assistente de Implantação de Projetos',occ:['PL']},
 'Assistente de Projetos SIG':{nome:'Assistente de Projetos',occ:['JR']},
 'Técnico de Segurança do Trabalho':{nome:'Técnico de Segurança do Trabalho',area:'Gente & Cultura',occ:['']},
 'Coordenador de Implantação de Projetos':{nome:'Coordenador de Implantação de Projetos',occ:['']},
 'Especialista em Geotecnologia':{nome:'Especialista em Geotecnologia',occ:['PL']},
 'Gerente de Recursos Humanos':{nome:'Gerente de Gente & Cultura',area:'Gente & Cultura',occ:['']},
 'Gerente Adm Financeiro':{nome:'Gerente Administrativo Financeiro',occ:['']},
 'Desenvolvedor':{nome:'Desenvolvedor Full Stack',occ:['JR','SR','SR']},
 'KAM':{nome:'Key Account Manager (KAM)',occ:['']},
 'Coordenador de Suporte Técnico':{nome:'Coordenador de Suporte Técnico',occ:['']},
 'Gerente de Operações':{nome:'Gerente de Operações',occ:['']},
 'Analista de Inovabilidade':{nome:'Analista de Inovabilidade Independente',occ:['']},
 'Gestor de Operações FAaaS':{nome:'Gerente de Projetos FAaaS',occ:['']},
 'Cientista de Dados':{nome:'Cientista de Dados',occ:['PL','JR']},
 'Coordenador de Marketing':{nome:'Coordenador de Growth Marketing',occ:['']},
 'Engenheiro Florestal':{nome:'Especialista em Incêndios Florestais',occ:['PL']}
};
// Cargos ocupados que ainda não têm DC
const SEM_DC=[];
function occText(occ){ if(!occ||!occ.length) return ''; const c={}; occ.forEach(l=>c[l||'s/ nível']=(c[l||'s/ nível']||0)+1); return ['JR','PL','SR','s/ nível'].filter(k=>c[k]).map(k=>k==='s/ nível'?`${c[k]}`:`${c[k]} ${k}`).join(' · '); }
function semDCpendentes(){ const nomes=new Set(allDCs().map(d=>d.cargoView.toLowerCase())); return SEM_DC.filter(x=>!nomes.has(x.nome.toLowerCase())); }

/* ============ DC model ============ */
function allDCs(){
  const out=[];
  BASE.forEach(b=>{
    if((STATE.removidas||[]).includes(b.id)) return;
    const o=STATE.dcs[b.id];
    const q=QUADRO[b.id]||null;
    const base={...b, area:(q&&q.area)||normArea(b.area), cargoView:(q&&q.nome)||titleCase(b.cargo)};
    out.push(o? {...base,...o,origem:'docx-editada',ocupantes:q?q.occ:[]} : {...base,ocupantes:q?q.occ:[]});
  });
  Object.values(STATE.dcs).forEach(d=>{ if(!BASE.find(b=>b.id===d.id)){ const sd=SEM_DC.find(x=>x.nome.toLowerCase()===(d.cargoView||'').toLowerCase()); out.push({...d,ocupantes:d.ocupantes||(sd?sd.occ:[])}); } });
  return out.map(d=>({...d, cargoView:d.cargoView||d.cargo, area:d.area&&d.area===d.area.toUpperCase()?normArea(d.area):(d.area||'Sem área')}))
            .sort((a,b)=>a.cargoView.localeCompare(b.cargoView,'pt'));
}
function getDC(id){ return allDCs().find(d=>d.id===id); }
function diagOf(id){ return STATE.diagnostico[id] || (STATE.diagnostico[id]={tecnicas:[],comportamentais:[]}); }
function levelsOf(dc){ const s=new Set(dc.responsabilidades.map(r=>r.nivel).filter(Boolean)); return ['Júnior','Pleno','Sênior','Especialista','Master'].filter(l=>s.has(l)); }
function splitSkills(lines){
  const out=[];
  (lines||[]).forEach(l=>{
    if(/^evidencia-se/i.test(l) || /^n\d\s*\/\s*(jr|pl|sr)\b/i.test(l.trim()) || l.includes('→') || /^(m[íi]nimo exigido|desej[áa]vel)\b/i.test(l)) return;
    l.split(/[•;\n]/).forEach(seg=>{
      seg=seg.replace(/^[\-–•\s]+|[;\.\s]+$/g,'').trim(); if(seg.length<3) return;
      // separa por vírgula (fora de parênteses) quando é uma lista de habilidades curtas
      const parts=[]; let depth=0, cur='';
      for(const ch of seg){ if(ch==='(') depth++; if(ch===')') depth--; if(ch===','&&depth<=0){ parts.push(cur); cur=''; } else cur+=ch; }
      parts.push(cur);
      const clean=parts.map(p=>p.trim().replace(/[\.\s]+$/,'')).filter(p=>p.length>2);
      const descritiva=/\b\w+(ndo|ndo-se)\b/i.test(seg); // frases com gerúndio são descrições: não quebrar
      const list = !descritiva && clean.length>1 && clean.every(p=>p.split(/\s+/).length<=6) ? clean : [seg];
      list.forEach(p=>out.push(p.charAt(0).toUpperCase()+p.slice(1)));
    });
  });
  return [...new Set(out)];
}

function renderNav(active){
  const items=[`<div class="sec">Visão</div><a href="#visao" class="${active==='visao'?'on':''}"><span class="n">◎</span>Visão geral do ciclo</a><div class="sec">Etapas do ciclo</div>`];

let LAST_HASH=null;
function route(){
  const h=(location.hash||'#visao').slice(1);
  // ao sair da tela de uma DC com marcações pendentes, grava no ciclo
  if(LAST_HASH && /^(dc|onb|diag|swot)-/.test(LAST_HASH) && h!==LAST_HASH && PENDING && ART) setTimeout(publishNow,50);
  const prevHash=LAST_HASH; LAST_HASH=h;
  let key = STAGES.find(s=>s.k===h)? h : 'visao';
  if(h.startsWith('dc-')){ const d=allDCs().find(x=>slug(x.id)===h.slice(3)); key='dc'; if(d){ if(VIEW.dc!==d.id) VIEW.nivel=null; VIEW.dc=d.id; } else VIEW.dc=null; }
  else VIEW.dc=null;
  if(h.startsWith('onb-')){ const p=allPessoas().find(x=>slug(x.id)===h.slice(4)); key='onboarding'; if(p){ if(VIEW.pessoa!==p.id) VIEW.day=null; VIEW.pessoa=p.id; } else VIEW.pessoa=null; }
  else { VIEW.pessoa=null; VIEW.day=null; }
  if(h.startsWith('diag-')){ const d=allDCs().find(x=>slug(x.id)===h.slice(5)); key='diagnostico'; VIEW.diagDc=d?d.id:null; } else VIEW.diagDc=null;
  if(h.startsWith('swot-')){ const p=allPessoas().find(x=>slug(x.id)===h.slice(5)); key='swot'; VIEW.swPid=p?p.id:null; } else VIEW.swPid=null;
  renderNav(key);
  if(key==='visao') renderOverview();
  else if(key==='dc') renderDC();
  else if(key==='onboarding') renderOnboarding();
  else if(key==='diagnostico') renderDiagnostico();
  else if(key==='swot') renderSwot();
  else if(key==='trilha') renderTrilha();
  else if(key==='pdi') renderEmbed('pdi');
  else if(key==='one-on-one') renderEmbed('oneonone');
  else if(key==='desempenho') renderEmbed('desempenho');
  else renderStage(STAGES.find(s=>s.k===key));
  if(prevHash!==h) window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

function renderDCDetail(id){
  const d=getDC(id); if(!d){ VIEW.dc=null; return renderDCList(); }
  const lv=levelsOf(d); if(VIEW.nivel===null) VIEW.nivel = lv.length? 'todos' : 'todos';
  const g=diagOf(id);
  const isT=t=>g.tecnicas.includes(t), isC=t=>g.comportamentais.includes(t);
  const respFiltered=d.responsabilidades.filter(r=>VIEW.nivel==='todos'||r.nivel===VIEW.nivel);
  let lastG=null;
  const respHTML=respFiltered.map(r=>{
    let h='';
    if(r.grupo && r.grupo!==lastG){ h+=`<li class="grp" style="display:block;border:none;background:none;padding:0">${esc(r.grupo)}</li>`; lastG=r.grupo; }
    const st=isT(r.texto)?'T':'';
    h+=`<li><button class="pick ${st}" data-t="${esc(r.texto)}" data-kind="T" title="Marcar como competência técnica do diagnóstico">${st||''}</button><div>${VIEW.nivel==='todos'&&r.nivel?`<span class="tag" style="margin-right:6px">${esc(r.nivel)}</span>`:''}${esc(r.texto)}</div></li>`;
    return h;
  }).join('');
  const C=d.competencias||{};
  const row=(k,label)=>{ const c=C[k]; if(!c) return ''; return `<tr><td>${label}</td><td><ul>${c.minimo.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></td><td><ul>${c.desejavel.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></td></tr>`; };
  const habCol=f=>{ const items=splitSkills((C['Habilidade']||{})[f]||[]); return items.length? `<ul class="hab">${items.map(t=>`<li><button class="pick pickC ${isC(t)?'C':''}" data-t="${esc(t)}" title="Marcar como competência comportamental do diagnóstico">${isC(t)?'C':''}</button><span>${esc(t)}</span></li>`).join('')}</ul>` : '<span class="muted">—</span>'; };
  const habRow = C['Habilidade'] ? `<tr class="habrow"><td>Habilidade<div class="tag amber" style="margin-top:6px">comportamental</div></td><td>${habCol('minimo')}</td><td>${habCol('desejavel')}</td></tr>` : '';

  $('#main').innerHTML=`
  <div class="crumb"><a href="#dc" id="back" style="text-decoration:none">← Descrições de Cargo</a> · Etapa 1</div>
  <div class="dhead">
    <div class="row" style="justify-content:space-between">
      <h2>${esc(d.cargoView)}</h2>
      <div class="row">
        <button class="btn ghost sm" style="color:#fff;border-color:#444" id="bDup">Duplicar como nova DC</button>
        <button class="btn red sm" id="bEdit">Editar</button>
      </div>
    </div>
    <div class="kv"><span>Área <b>${esc(d.area)}</b></span><span>Cargo superior <b>${esc(d.superior||'—')}</b></span><span>Colaboradores <b>${d.ocupantes&&d.ocupantes.length?d.ocupantes.length+(occText(d.ocupantes).match(/[A-Z]/)?' ('+occText(d.ocupantes)+')':''):'sem ocupante'}</b></span><span>Origem <b>${d.origem==='app'?'Criada no ciclo':d.origem==='docx-editada'?esc(d.arquivo)+' (editada aqui)':esc(d.arquivo)}</b></span></div>
  </div>
  <div class="detail">
    <div>
      <div class="card block"><h3>Missão do cargo</h3><div>${esc(d.missao)||'<span class="muted">Não informada.</span>'}</div></div>
      <div class="card block">
        <h3>Responsabilidades</h3>
        ${lv.length?`<div class="tabs">${['todos',...lv].map(l=>`<button data-l="${l}" class="${VIEW.nivel===l?'on':''}">${l==='todos'?'Todos os níveis':esc(l)}</button>`).join('')}</div>`:''}
        <p class="muted" style="margin:0 0 10px;font-size:12px">Responsabilidades são <b>técnicas</b>. Clique no quadrado para marcar <b>T</b> (ou desmarcar).</p>
        <ul class="resp">${respHTML||'<li><span></span><span class="muted">Sem responsabilidades neste nível.</span></li>'}</ul>
      </div>
      <div class="card block">
        <h3>Competências</h3>
        <div style="overflow:auto"><table class="t comp"><thead><tr><th style="width:120px"></th><th>Mínimo exigido</th><th>Desejável</th></tr></thead>
        <tbody>${row('Experiência','Experiência')}${row('Formação','Formação')}${row('Conhecimento','Conhecimento')}${habRow}</tbody></table></div>
        <p class="muted" style="margin:10px 0 0;font-size:12px">Habilidades são <b>comportamentais</b>. Clique no quadrado ao lado de cada habilidade para marcar <b>C</b>.</p>

      <div class="addline"><input class="input" id="addT" placeholder="Escrever competência técnica…"><button class="btn sm" id="bAddT">+</button></div>
      <div class="meter"><span>Comportamentais</span><span>${g.comportamentais.length}/6</span></div>

      <div class="addline"><input class="input" id="addC" placeholder="Escrever competência comportamental…"><button class="btn sm" id="bAddC">+</button></div>
      <div class="hint"><b>Onde marcar</b><br><b>T</b> — técnicas: nas <b>Responsabilidades</b> do cargo.<br><b>C</b> — comportamentais: na linha <b>Habilidade</b> do quadro Competências.<br><button class="btn ghost sm" id="goHab" style="margin-top:8px">Ir para Habilidades ↓</button></div>
    </aside>
  </div>`;

  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{VIEW.nivel=b.dataset.l; renderDCDetail(id);});
  const toggle=(t,first)=>{
    const inT=g.tecnicas.indexOf(t), inC=g.comportamentais.indexOf(t);
    if(inT<0&&inC<0){ (first==='T'?g.tecnicas:g.comportamentais).push(t); }
    else if(inT>=0){ g.tecnicas.splice(inT,1); if(first==='T') g.comportamentais.push(t); }
    else { g.comportamentais.splice(inC,1); if(first==='C') g.tecnicas.push(t); }
    if(g.tecnicas.length>6||g.comportamentais.length>6) toast('Acima de 6 — o ideal é ~6 de cada tipo');
    persist(); renderDCDetail(id);
  };
  const flip=(arr,t,lim)=>{ const i=arr.indexOf(t); if(i>=0) arr.splice(i,1); else { arr.push(t); if(arr.length>lim) toast('Acima de 6 — o ideal é ~6 de cada tipo'); } persist(); renderDCDetail(id); };
  document.querySelectorAll('.pick:not(.pickC)').forEach(b=>b.onclick=()=>flip(g.tecnicas,b.dataset.t,6));
  document.querySelectorAll('.pickC').forEach(b=>b.onclick=()=>flip(g.comportamentais,b.dataset.t,6));
  $('#goHab').onclick=()=>{ const r=document.querySelector('.habrow'); if(r) r.scrollIntoView({behavior:'smooth',block:'center'}); };
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ (b.dataset.rm==='T'?g.tecnicas:g.comportamentais).splice(+b.dataset.i,1); persist(); renderDCDetail(id); });
  const add=(inp,arr)=>{ const v=$(inp).value.trim(); if(!v) return; if(!arr.includes(v)) arr.push(v); persist(); renderDCDetail(id); };
  $('#bAddT').onclick=()=>add('#addT',g.tecnicas); $('#bAddC').onclick=()=>add('#addC',g.comportamentais);

  document.querySelectorAll('.bSaveInline').forEach(b=>b.onclick=publishNow); syncUI();
  $('#bEdit').onclick=()=>openEditor(d,false);
  $('#bDup').onclick=()=>openEditor(d,true);

/* ============ editor ============ */
const NIVEIS=['','Júnior','Pleno','Sênior','Especialista','Master'];
function openEditor(dc,dup,fresh){
  const isNew=!dc||dup;
  const d=dc? JSON.parse(JSON.stringify(dc)) : {cargoView:'',superior:'',area:'',missao:'',responsabilidades:[{texto:'',nivel:'',grupo:''}],competencias:{}};
  if(dup&&!fresh){ d.cargoView=d.cargoView+' (cópia)'; }
  const areas=[...new Set(allDCs().map(x=>x.area))];
  const C=d.competencias||{};
  const ta=(k,f)=>esc(((C[k]||{})[f]||[]).join('\n'));
  $('#mbox').innerHTML=`
    <h2>${isNew?'Nova Descrição de Cargo':'Editar Descrição de Cargo'}</h2>
    <p class="muted" style="margin:0 0 16px">${isNew?'Mesma estrutura das DCs da UGM: identificação, missão, responsabilidades (por nível, se houver) e competências.':'As alterações ficam registradas no ciclo. O arquivo .docx original não é alterado.'}</p>
    <div class="grid g3">
      <div class="f"><label>Nome da função *</label><input class="input" id="eCargo" value="${esc(d.cargoView)}"></div>
      <div class="f"><label>Cargo superior</label><input class="input" id="eSup" value="${esc(d.superior)}"></div>
      <div class="f"><label>Área contratante</label><input class="input" id="eArea" list="areasL" value="${esc(d.area)}"><datalist id="areasL">${areas.map(a=>`<option>${esc(a)}</option>`).join('')}</datalist></div>
    </div>
    <div class="f" style="margin-top:12px"><label>Missão do cargo</label><textarea class="input" id="eMis">${esc(d.missao)}</textarea></div>
    <div class="f" style="margin-top:16px"><label>Responsabilidades</label>
      <div class="muted" style="font-size:12px;margin-bottom:4px">Nível e grupo são opcionais. Use nível quando o cargo tiver JR/PL/SR (ou Pleno → Master para especialistas).</div>
      <div class="rlist" id="rlist"></div>
      <div><button class="btn ghost sm" id="addR" style="margin-top:6px">+ responsabilidade</button></div>
    </div>
    <div class="f" style="margin-top:16px"><label>Competências (uma por linha)</label></div>
    <div style="overflow:auto"><table class="t"><thead><tr><th style="width:110px"></th><th>Mínimo exigido</th><th>Desejável</th></tr></thead><tbody>
      ${['Experiência','Formação','Conhecimento','Habilidade'].map(k=>`<tr><td>${k}</td><td><textarea class="input" style="width:100%" data-c="${k}" data-f="minimo">${ta(k,'minimo')}</textarea></td><td><textarea class="input" style="width:100%" data-c="${k}" data-f="desejavel">${ta(k,'desejavel')}</textarea></td></tr>`).join('')}
    </tbody></table></div>
    <div class="mfoot">
      <div>${!isNew&&dc.origem==='app'?'<button class="btn ghost" id="eDel" style="color:var(--red)">Excluir DC</button>':''}${!isNew&&dc.origem==='docx-editada'?'<button class="btn ghost" id="eRevert">Voltar ao .docx original</button>':''}</div>
      <div class="row"><button class="btn ghost" id="eCancel">Cancelar</button><button class="btn red" id="eSave">Salvar DC</button></div>
    </div>`;
  const rows=d.responsabilidades.length?d.responsabilidades:[{texto:'',nivel:'',grupo:''}];
  const drawRows=()=>{
    $('#rlist').innerHTML=rows.map((r,i)=>`<div class="rrow"><textarea class="input" data-i="${i}" data-k="texto" placeholder="Descreva a responsabilidade…">${esc(r.texto)}</textarea>
      <select class="input" data-i="${i}" data-k="nivel">${NIVEIS.map(n=>`<option value="${n}" ${n===r.nivel?'selected':''}>${n||'Sem nível'}</option>`).join('')}</select>
      <input class="input" data-i="${i}" data-k="grupo" placeholder="Grupo (opcional)" value="${esc(r.grupo)}">
      <button class="x" data-del="${i}" title="Remover">×</button></div>`).join('');
    $('#rlist').querySelectorAll('[data-k]').forEach(el=>el.oninput=el.onchange=()=>{rows[+el.dataset.i][el.dataset.k]=el.value;});
    $('#rlist').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.del,1); drawRows();});
  };
  drawRows();
  $('#addR').onclick=()=>{ const last=rows[rows.length-1]||{}; rows.push({texto:'',nivel:last.nivel||'',grupo:last.grupo||''}); drawRows(); };
  const close=()=>$('#modal').classList.remove('on');
  $('#eCancel').onclick=close;
  if($('#eDel')) $('#eDel').onclick=()=>{ if($('#eDel').dataset.ok){ delete STATE.dcs[dc.id]; delete STATE.diagnostico[dc.id]; persist(); close(); location.hash='#dc'; } else { $('#eDel').dataset.ok=1; $('#eDel').textContent='Clique de novo para confirmar'; } };
  if($('#eRevert')) $('#eRevert').onclick=()=>{ delete STATE.dcs[dc.id]; persist(); close(); renderDC(); toast('DC restaurada do .docx'); };
  $('#eSave').onclick=()=>{
    const cargo=$('#eCargo').value.trim(); if(!cargo){ $('#eCargo').focus(); toast('Informe o nome da função'); return; }
    const comp={};
    document.querySelectorAll('#mbox textarea[data-c]').forEach(t=>{ const k=t.dataset.c; comp[k]=comp[k]||{minimo:[],desejavel:[]}; comp[k][t.dataset.f]=t.value.split('\n').map(s=>s.trim()).filter(Boolean); });
    const obj={cargoView:cargo,cargo:cargo,superior:$('#eSup').value.trim(),area:(/^(recursos humanos|rh)$/i.test($('#eArea').value.trim())?'Gente & Cultura':$('#eArea').value.trim())||'Sem área',missao:$('#eMis').value.trim(),
      responsabilidades:rows.filter(r=>r.texto.trim()).map(r=>({texto:r.texto.trim(),nivel:r.nivel,grupo:r.grupo.trim()})),competencias:comp,atualizado:new Date().toISOString()};
    let id;
    if(isNew){ id='app-'+slug(cargo)+'-'+Date.now().toString(36); STATE.dcs[id]={...obj,id,origem:'app',arquivo:'',criado:new Date().toISOString()}; if(dup&&!fresh){ const g=STATE.diagnostico[dc.id]; if(g) STATE.diagnostico[id]=JSON.parse(JSON.stringify(g)); } }
    else { id=dc.id; STATE.dcs[id]={...(STATE.dcs[id]||{}),...obj,id,origem:dc.origem==='app'?'app':undefined,arquivo:dc.arquivo}; if(dc.origem!=='app') delete STATE.dcs[id].origem; }
    persist(); close(); if(location.hash==='#dc-'+slug(id)) renderDC(); else location.hash='#dc-'+slug(id); toast('DC salva');
  };
  $('#modal').classList.add('on'); $('#modal').scrollTop=0;
}

/* ============ backup ============ */
function openBackup(){
  $('#mbox').innerHTML=`<h2>Backup e importação</h2>
    <p class="muted">Tudo o que foi criado ou editado aqui (DCs novas, edições e escolhas para o diagnóstico). Copie para guardar, ou cole um backup para restaurar.</p>
    <textarea class="input" id="bk" style="width:100%;min-height:260px;font-family:ui-monospace,monospace;font-size:12px">${esc(JSON.stringify(STATE,null,1))}</textarea>
    <div class="mfoot"><input type="file" id="bkf" accept=".json,application/json" class="input">
    <div class="row"><button class="btn ghost" id="bkC">Fechar</button><button class="btn ghost" id="bkCopy">Copiar</button><button class="btn red" id="bkImp">Importar o texto acima</button></div></div>`;
  $('#modal').classList.add('on');
  $('#bkC').onclick=()=>$('#modal').classList.remove('on');
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText($('#bk').value); toast('Copiado'); }catch(e){ $('#bk').select(); toast('Selecionado — use Ctrl+C'); } };
  $('#bkf').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{$('#bk').value=t; toast('Arquivo carregado — clique em Importar');}); };
  $('#bkImp').onclick=()=>{ try{ const s=JSON.parse($('#bk').value); if(!s.dcs||!s.diagnostico) throw 0; STATE={...STATE,...s}; persist(); $('#modal').classList.remove('on'); route(); toast('Backup importado'); }catch(e){ toast('Texto inválido'); } };
}
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); });

    faixas:[{min:.705,cls:'Alto',txt:'apto a seguir para o D90'},{min:.5,cls:'Médio',txt:'alerta → reforço focado'},{min:0,cls:'Baixo',txt:'risco → intervenção imediata'}],
    regua:'≥ 71% apto a seguir para D90 · 50% a 70% alerta → reforço focado · < 50% risco → intervenção imediata',
    obj:[
      {t:'Processo',p:.5,it:[['Executa parcialmente as rotinas do cargo sem supervisão direta',.5],['Cumpre prazos com estabilidade, mantendo ritmo e qualidade semanais',.3],['Organiza o próprio fluxo de trabalho, entendendo o que vem antes e depois da sua entrega',.2]]},
      {t:'Reforço',p:.3,it:[['Demonstra consistência na qualidade das entregas, sem oscilações semanais bruscas',.5],['Aplica feedbacks rapidamente, demonstrando evolução perceptível',.2],['Busca reforço no timing correto, sem depender demais nem travar por falta de orientação',.3]]},
      {t:'Impacto',p:.2,it:[['Participa ativamente dos ritos, reuniões e projetos da área, com contribuições relevantes',.4],['Faz perguntas de qualidade, demonstrando antecipação de riscos e entendimento dos impactos',.3],['Sugere pequenas melhorias em rotinas, processos ou ferramentas',.3]]}]},
  d90:{n:90,off:85,cor:'#1f8a4c',titulo:'Fechamento e NPS do Colaborador',
    foco:'Fase final: o colaborador já opera com pelo menos 80% de autonomia, mantém resultados consistentes, demonstra visão ampla do processo e entra na consolidação do período de experiência. Aqui ouvimos a percepção do próprio colaborador sobre a jornada.',
    funcionou:[['acolhimento','Acolhimento / Integração','recepção, time, liderança'],['clareza','Clareza','descrição de cargo, expectativas, processos'],['organizacao','Organização','fluxo do onboarding, materiais, ritos'],['treinamentos','Treinamentos','qualidade e aplicabilidade'],['comunicacao','Comunicação','com gestor, pares, GC'],['ferramentas','Ferramentas','sistemas, acessos, suporte'],['cultura','Cultura','valores, ambiente, ritos da UGM']],
    melhorar:[['processos','Processos confusos ou não estruturados'],['acessos','Atraso em acessos e ferramentas'],['treinamentos','Treinamentos insuficientes ou demorados'],['ritos','Ritos pouco explicados'],['lideranca','Comunicação da liderança'],['informacoes','Volume de informações grande demais rapidamente'],['infra','Infraestrutura / suporte / sistemas']]}
};
const DAYS=['d30','d60','d90'];
const INTRO={
  d30:n=>`Realizamos o Day 30 do onboarding de ${n} e gostaria de compartilhar uma visão inicial sobre sua experiência de integração, destacando as percepções deste primeiro mês e as oportunidades identificadas para favorecer seu desenvolvimento na função.`,
  d60:n=>`Realizamos o Day 60 do onboarding de ${n} e compartilho a leitura deste segundo ciclo, com foco na execução das rotinas, na autonomia crescente e nos pontos que merecem reforço para a etapa final da jornada.`,
  d90:n=>`Concluímos o Day 90 do onboarding de ${n}, encerrando a jornada de integração. Compartilho a leitura consolidada do período, incluindo a percepção do próprio colaborador sobre sua experiência.`
};
VIEW.pessoa=null; VIEW.day=null; VIEW.onbTab='processo'; VIEW.pq='';

/* ---- dados ---- */
const addDays=(iso,n)=>{ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d; };
const fmt=d=>d? d.toLocaleDateString('pt-BR') : '—';
const fmtIso=iso=>iso? fmt(new Date(iso+'T00:00:00')) : '—';
const diasDesde=iso=>Math.floor((HOJE-new Date(iso+'T00:00:00'))/864e5);
const primeiro=n=>(n||'').split(' ')[0];
function cargoNome(p){ const q=QUADRO[p.dc]; return (q&&q.nome)||p.funcao; }
function allPessoas(){
  const extra=Object.values(STATE.pessoas||{});
  return [...PESSOAS_BASE.map(p=>({...p,...((STATE.pessoasEdit||{})[p.id]||{})})),...extra].filter(p=>!(STATE.desligados||[]).includes(p.id) && !(window.CICLO_DESLIG||[]).includes(normTxt(p.nome)));
}
function getP(id){ return allPessoas().find(p=>p.id===id); }
function onbOf(id){ STATE.onboarding=STATE.onboarding||{}; return STATE.onboarding[id]||(STATE.onboarding[id]={}); }
function dayOf(id,k){ const o=onbOf(id); return o[k]||(o[k]= k==='d90'?{nps:null,funcionou:{},melhorar:{},coment:'',status:''}:{resp:{},status:''}); }
function scoreDay(k,dd){
  if(k==='d90') return null;
  const T=ONB[k]; let tot=0,feitos=0,n=0;
  T.obj.forEach((o,i)=>o.it.forEach(([t,w],j)=>{ n++; const r=(dd.resp||{})[`o${i+1}i${j+1}`]; if(r&&r.nota){ feitos++; tot+=o.p*w*NOTA_V[r.nota]/5; } }));
  if(!feitos) return {pct:null,feitos,n};
  const f=T.faixas.find(x=>tot>=x.min);
  return {pct:tot,feitos,n,cls:f.cls,txt:f.txt,completo:feitos===n};
}
function npsCls(v){ if(v==null||v==='') return null; v=+v; return v>=8?{cls:'Promotor',txt:'Experiência excelente'}:v>=6?{cls:'Neutro',txt:'Experiência satisfatória'}:{cls:'Detrator',txt:'Experiência abaixo da expectativa'}; }
function forcaCls(v){ v=+v; return v>=8?'Força real da jornada':v>=6?'Funcionou, mas não encantou':'Força fraca'; }
function oportCls(v){ v=+v; return v>=8?'Oportunidade crítica (alto impacto negativo)':v>=4?'Oportunidade relevante (impacto moderado)':'Melhoria desejável, não urgente'; }
function d90Completo(dd){ return dd.nps!=null && ONB.d90.funcionou.every(([k])=>dd.funcionou[k]!=null) && ONB.d90.melhorar.every(([k])=>dd.melhorar[k]!=null); }
function stDay(p,k){
  const dd=(onbOf(p.id)||{})[k]||{}; const due=addDays(p.adm,ONB[k].off);
  if(dd.status==='concluido') return {s:'concluido',lbl:'Concluído',due};
  const filled = k==='d90'? d90Completo(dd) : (scoreDay(k,dd)||{}).completo;
  if(filled) return {s:'avaliado',lbl:'Parecer pendente',due};
  const late=(HOJE-due)/864e5;
  if(late>7) return {s:'atrasado',lbl:'Atrasado',due};
  if(late>=0) return {s:'pendente',lbl:'Realizar agora',due};
  return {s:'agendado',lbl:'Agendado',due};
}
function onbAtivo(p){ const o=(STATE.onboarding||{})[p.id]; if(o&&o.fora) return false; if(o&&o.inicio) return true; return diasDesde(p.adm)<=90 && diasDesde(p.adm)>=0; }
function onbEncerrado(p){ const o=(STATE.onboarding||{})[p.id]||{}; return !!(o.d90&&o.d90.status==='concluido'); }
function proximo(p){ for(const k of DAYS){ const st=stDay(p,k); if(st.s!=='concluido') return {k,...st}; } return null; }

/* ---- lista ---- */
function renderOnboarding(){ VIEW.pessoa? renderPessoa(VIEW.pessoa) : renderOnbList(); }
function stTag(st){ const m={concluido:'dark',avaliado:'amber',atrasado:'red',pendente:'red',agendado:''}; return `<span class="tag ${m[st.s]}">${st.lbl}</span>`; }
function renderOnbList(){
  const ps=allPessoas();

  const acoes=emProc.filter(p=>{const x=proximo(p); return x&&['pendente','atrasado','avaliado'].includes(x.s);}).length;
  $('#main').innerHTML=`
  <div class="crumb">Etapa 2 de 9 · Integração e adaptação</div>
  <div class="pagehead">
    <div><h1>Onboarding 30/60/90</h1><p>Acompanhamento estruturado de GC e gestor durante o período de experiência. O Day 1 acontece na integração de boas-vindas; aqui registramos os checkpoints <b>Day 30</b>, <b>Day 60</b> e <b>Day 90</b>, com relatório e parecer de Gente &amp; Cultura.</p></div>
    <button class="btn red" id="bNovaP">+ Novo colaborador</button>
  </div>
  <div class="stats">
    <div class="stat"><b>${ps.length}</b><span>colaboradores ativos</span></div>
    <div class="stat"><b>${emProc.length}</b><span>em onboarding agora</span></div>
    <div class="stat"><b>${acoes}</b><span>com checkpoint a fazer</span></div>
    <div class="stat"><b>${encerr.length}</b><span>jornadas concluídas</span></div>
  </div>
  <div class="tabs" style="margin-bottom:14px">
    <button data-t="processo" class="${VIEW.onbTab==='processo'?'on':''}">Em onboarding (${emProc.length})</button>
    <button data-t="concluidos" class="${VIEW.onbTab==='concluidos'?'on':''}">Concluídos (${encerr.length})</button>
    <button data-t="todos" class="${VIEW.onbTab==='todos'?'on':''}">Relação de pessoal ativo (${ps.length})</button>
  </div>
  <div id="onbBody"></div>
  <p class="muted" style="font-size:12px;margin-top:16px">Relação de pessoal: MasterFile (C&amp;S) em ${MF_DATA}, sem diretoria${Object.keys(STATE.pessoas||{}).length?` + ${Object.keys(STATE.pessoas).length} incluído(s) aqui`:''}. Checkpoints: Day 30 = admissão + 24 dias · Day 60 = + 55 · Day 90 = + 85.</p>`;
  document.querySelectorAll('.tabs button[data-t]').forEach(b=>b.onclick=()=>{VIEW.onbTab=b.dataset.t; renderOnbList();});
  $('#bNovaP').onclick=()=>openPessoaForm();
  const body=$('#onbBody');
  const card=p=>{ const d=Math.max(0,diasDesde(p.adm)); const nx=proximo(p);
    return `<div class="pcard" data-p="${esc(p.id)}">
      <div class="row" style="justify-content:space-between;align-items:flex-start"><div><h4>${esc(p.nome)}</h4><div class="muted" style="font-size:12px">${esc(cargoNome(p))}${p.nivel?' '+esc(p.nivel):''} · ${esc(p.area)} · gestor ${esc(p.gestor)}</div></div><span class="tag">${p.contrato}</span></div>
      <div class="tl">${['d1','d30','d60','d90'].map(k=>{ if(k==='d1') return `<div class="tlp done"><i></i><span>D1</span></div>`; const st=stDay(p,k); return `<div class="tlp ${st.s}"><i></i><span>D${ONB[k].n}</span></div>`; }).join('')}<div class="tlbar"><b style="width:${Math.min(100,d/90*100)}%"></b></div></div>
      <div class="row" style="justify-content:space-between;font-size:12.5px"><span>Admissão ${fmtIso(p.adm)} · <b>dia ${d}</b> da jornada</span>${nx?`<span>Day ${ONB[nx.k].n}: ${fmt(nx.due)} ${stTag(nx)}</span>`:'<span class="tag dark">Jornada concluída</span>'}</div>
    </div>`; };
  if(VIEW.onbTab==='processo'){
    body.innerHTML = emProc.length? `<div class="pgrid">${emProc.map(card).join('')}</div>` : '<div class="soon">Ninguém em onboarding no momento. Inclua um novo colaborador ou inicie a jornada pela relação de pessoal.</div>';
  } else if(VIEW.onbTab==='concluidos'){
    body.innerHTML = encerr.length? `<div class="pgrid">${encerr.map(card).join('')}</div>` : '<div class="soon">Nenhuma jornada concluída registrada ainda.</div>';
  } else {
    body.innerHTML=`<div class="toolbar"><input class="input search" id="pq" placeholder="Buscar nome, cargo, gestor ou área…" value="${esc(VIEW.pq)}"></div><div class="card" style="padding:4px 8px;overflow:auto"><table class="t" id="ptab"></table></div>`;
    const draw=()=>{ const q=VIEW.pq.toLowerCase(); const list=ps.filter(p=>!q||(p.nome+' '+cargoNome(p)+' '+p.gestor+' '+p.area).toLowerCase().includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
      $('#ptab').innerHTML=`<thead><tr><th>Colaborador</th><th>Cargo</th><th>Área</th><th>Gestor</th><th>Contrato</th><th>Admissão</th><th>Onboarding</th></tr></thead><tbody>${list.map(p=>{ const at=onbAtivo(p)&&!onbEncerrado(p), en=onbEncerrado(p);
        return `<tr><td>${esc(p.nome)}${p.origem==='app'?' <span class="tag red">novo</span>':''}</td><td><a href="#dc-${slug(p.dc)}" style="text-decoration:none">${esc(cargoNome(p))}</a>${p.nivel?' <span class="tag">'+esc(p.nivel)+'</span>':''}</td><td>${esc(p.area)}</td><td>${esc(p.gestor)}</td><td>${p.contrato}</td><td>${fmtIso(p.adm)}</td><td>${at?`<a class="tag red" href="#onb-${slug(p.id)}" style="text-decoration:none">em andamento · dia ${diasDesde(p.adm)}</a>`:en?`<a class="tag dark" href="#onb-${slug(p.id)}" style="text-decoration:none">concluído</a>`:`<button class="btn ghost sm" data-ini="${esc(p.id)}">Abrir jornada</button>`}</td></tr>`; }).join('')}</tbody>`;
      document.querySelectorAll('[data-ini]').forEach(b=>b.onclick=()=>{ const o=onbOf(b.dataset.ini); o.inicio=o.inicio||new Date().toISOString(); delete o.fora; persist(); location.hash='#onb-'+slug(b.dataset.ini); });
    };
    draw(); $('#pq').oninput=e=>{VIEW.pq=e.target.value; draw();};
  }
  document.querySelectorAll('.pcard').forEach(el=>el.onclick=()=>{ location.hash='#onb-'+slug(el.dataset.p); });
}

/* ---- novo colaborador ---- */
function openPessoaForm(){
  const dcs=allDCs(); const gest=[...new Set(allPessoas().map(p=>p.gestor))].sort(); const areas=[...new Set(allPessoas().map(p=>p.area))].sort();
  $('#mbox').innerHTML=`<h2>Novo colaborador</h2><p class="muted" style="margin:0 0 16px">Inclui a pessoa na relação de pessoal do ciclo e já abre a jornada 30/60/90 a partir da admissão. Atualize também o MasterFile.</p>
  <div class="grid g2">
    <div class="f"><label>Nome completo *</label><input class="input" id="nNome"></div>
    <div class="f"><label>Data de admissão *</label><input class="input" type="date" id="nAdm" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="f"><label>Cargo (DC) *</label><select class="input" id="nDc"><option value="">Selecione…</option>${dcs.map(d=>`<option value="${esc(d.id)}">${esc(d.cargoView)}</option>`).join('')}</select></div>
    <div class="f"><label>Nível</label><select class="input" id="nNiv"><option value="">—</option><option>JR</option><option>PL</option><option>SR</option></select></div>
    <div class="f"><label>Gestor *</label><input class="input" id="nGest" list="gL"><datalist id="gL">${gest.map(g=>`<option>${esc(g)}</option>`).join('')}</datalist></div>
    <div class="f"><label>Área</label><input class="input" id="nArea" list="aL"><datalist id="aL">${areas.map(g=>`<option>${esc(g)}</option>`).join('')}</datalist></div>
    <div class="f"><label>Contrato</label><select class="input" id="nCt"><option>CLT</option><option>PJ</option></select></div>
  </div>
  <div class="mfoot"><span></span><div class="row"><button class="btn ghost" id="nCancel">Cancelar</button><button class="btn red" id="nSave">Incluir e abrir jornada</button></div></div>`;
  $('#modal').classList.add('on');
  $('#nDc').onchange=()=>{ const d=getDC($('#nDc').value); if(d&&!$('#nArea').value) $('#nArea').value=d.area; };
  $('#nCancel').onclick=()=>$('#modal').classList.remove('on');
  $('#nSave').onclick=()=>{
    const nome=$('#nNome').value.trim(), adm=$('#nAdm').value, dc=$('#nDc').value, gestor=$('#nGest').value.trim();
    if(!nome||!adm||!dc||!gestor){ toast('Preencha nome, admissão, cargo e gestor'); return; }
    const id='app-'+slug(nome)+'-'+Date.now().toString(36);
    STATE.pessoas=STATE.pessoas||{};
    const fim=addDays(adm,89).toISOString().slice(0,10);
    STATE.pessoas[id]={id,nome,adm,fimExp:$('#nCt').value==='CLT'?fim:'',funcao:(getDC(dc)||{}).cargoView||'',nivel:$('#nNiv').value,contrato:$('#nCt').value,gestor,area:$('#nArea').value.trim()||(getDC(dc)||{}).area||'',sub:'',dc,origem:'app',criado:new Date().toISOString()};
    const o=onbOf(id); o.inicio=new Date().toISOString();
    persist(); $('#modal').classList.remove('on'); location.hash='#onb-'+slug(id); toast('Colaborador incluído');
  };
}

/* ---- jornada individual ---- */
function renderPessoa(id){
  const p=getP(id); if(!p){ VIEW.pessoa=null; return renderOnbList(); }
  const o=onbOf(id);
  if(!VIEW.day){ const nx=proximo(p); VIEW.day=nx? nx.k : 'd90'; }
  const k=VIEW.day, T=ONB[k], dd=dayOf(id,k), st=stDay(p,k);
  const d=Math.max(0,diasDesde(p.adm));
  $('#main').innerHTML=`
  <div class="crumb"><a href="#onboarding" style="text-decoration:none">← Onboarding 30/60/90</a> · Etapa 2</div>
  <div class="dhead">
    <div class="row" style="justify-content:space-between"><h2>${esc(p.nome)}</h2>
      <div class="row">${o.origem?`<span class="tag" style="background:#2b2b2b;color:#ccc">histórico: ${esc(o.origem)}</span>`:''}${onbEncerrado(p)?'<span class="tag dark">Jornada concluída</span>':''}<button class="btn ghost sm" style="color:#fff;border-color:#444" id="bFora">${o.fora?'Reabrir jornada':'Retirar do processo'}</button></div></div>
    <div class="kv"><span>Cargo <b><a href="#dc-${slug(p.dc)}" style="color:#fff">${esc(cargoNome(p))}</a>${p.nivel?' '+esc(p.nivel):''}</b></span><span>Área <b>${esc(p.area)}</b></span><span>Gestor <b>${esc(p.gestor)}</b></span><span>Contrato <b>${p.contrato}</b></span><span>Admissão <b>${fmtIso(p.adm)}</b></span>${p.fimExp?`<span>Fim da experiência <b>${fmtIso(p.fimExp)}</b></span>`:''}<span>Hoje <b>dia ${d}</b></span></div>
  </div>
  <div class="daytabs">
    <div class="dtab done"><b>Day 1</b><span>Integração / boas-vindas</span></div>
    ${DAYS.map(x=>{ const s=stDay(p,x); return `<button class="dtab ${x===k?'on':''} ${s.s}" data-d="${x}"><b>Day ${ONB[x].n}</b><span>${fmt(s.due)} · ${s.lbl}</span></button>`; }).join('')}
  </div>
  <div class="detail">
    <div>
      <div class="card block">
        <h3>Day ${T.n} — ${esc(T.titulo)}</h3>
        <p class="muted" style="margin:-4px 0 12px">${esc(T.foco)}</p>
        <div class="row" style="margin-bottom:10px"><div class="f"><label>Data da avaliação</label><input class="input" type="date" id="dData" value="${dd.data||addDays(p.adm,T.off).toISOString().slice(0,10)}"></div><div class="f" style="flex:1"><label>Avaliado com</label><input class="input" id="dCom" placeholder="Gestor / participantes" value="${esc(dd.com||p.gestor)}"></div></div>
        ${k==='d90'? formD90(dd) : formDay(k,dd)}
      </div>
    </div>
    <aside class="card diag" id="dSide">${sideDay(p,k,dd)}</aside>
  </div>
  <div class="card block" id="parecerCard">${parecerHTML(p,k,dd)}</div>`;
  document.querySelectorAll('.dtab[data-d]').forEach(b=>b.onclick=()=>{ VIEW.day=b.dataset.d; renderPessoa(id); });
  $('#bFora').onclick=()=>{ if(o.fora){ delete o.fora; o.inicio=o.inicio||new Date().toISOString(); } else o.fora=true; persist(); location.hash='#onboarding'; };
  $('#dData').onchange=e=>{ dd.data=e.target.value; persist(); };
  $('#dCom').oninput=e=>{ dd.com=e.target.value; persist(); };
  bindDayForm(p,k,dd); bindParecer(p,k,dd);
}
function formDay(k,dd){
  const T=ONB[k];
  return `<div class="rub">${NOTAS.map((n,i)=>`<span><b>${n}</b> ${esc(T.rubrica[i])}</span>`).join('')}</div>`+
  T.obj.map((ob,i)=>`<div class="obj"><div class="objh"><span>Objetivo ${i+1} — ${esc(ob.t)}</span><span class="tag">peso ${Math.round(ob.p*100)}%</span></div>
    ${ob.it.map(([t,w],j)=>{ const key=`o${i+1}i${j+1}`, r=(dd.resp||{})[key]||{};
      return `<div class="item"><div class="itxt">${esc(t)} <span class="muted" style="font-size:11px">(${Math.round(w*100)}%)</span></div>
        <div class="notas">${NOTAS.map(n=>`<button class="nota n${NOTA_V[n]} ${r.nota===n?'on':''}" data-key="${key}" data-n="${n}">${n}</button>`).join('')}</div>
        <input class="input obs" data-obs="${key}" placeholder="Observação (opcional)" value="${esc(r.obs||'')}"></div>`; }).join('')}</div>`).join('');
}
function formD90(dd){
  const T=ONB.d90; const sc=(name,key,val,meta)=>`<div class="sc">${Array.from({length:10},(_,i)=>i+1).map(v=>`<button class="scb ${+val===v?'on':''} ${meta==='alto'?(v>=8?'g':v>=6?'y':'r'):(v<=3?'g':v<=7?'y':'r')}" data-g="${name}" data-k="${key}" data-v="${v}">${v}</button>`).join('')}</div>`;
  return `<div class="obj"><div class="objh"><span>De 1 a 10, como foi sua experiência de integração?</span><span class="tag">meta ≥ 8</span></div>${sc('nps','nps',dd.nps,'alto')}</div>
  <div class="obj"><div class="objh"><span>De 1 a 10, o que funcionou bem?</span><span class="tag">meta ≥ 8</span></div>
    ${T.funcionou.map(([key,l,h])=>`<div class="item"><div class="itxt"><b>${esc(l)}</b> <span class="muted">(${esc(h)})</span></div>${sc('funcionou',key,dd.funcionou[key],'alto')}</div>`).join('')}</div>

function itensPorNota(k,dd){

function rascunho(p,k,dd){
  const n=primeiro(p.nome);

    const T=ONB.d90, nc=npsCls(dd.nps);
    const fr=T.funcionou.filter(([x])=>dd.funcionou[x]>=8).map(([,l])=>l), op=T.melhorar.filter(([x])=>dd.melhorar[x]>3).sort((a,b)=>dd.melhorar[b[0]]-dd.melhorar[a[0]]);
    return {intro:INTRO.d90(n),
      forcas: fr.length? [`${n} avaliou como pontos fortes da jornada: ${fr.join(', ').toLowerCase()}.`] : [],
      pontos: op.map(([x,l])=>({titulo:l,texto:`Avaliado com nota ${dd.melhorar[x]} — ${oportCls(dd.melhorar[x]).toLowerCase()}. [descrever a recomendação]`})),
      visao:`${n} avaliou sua experiência de integração com nota ${dd.nps??'—'}${nc?` (${nc.cls.toLowerCase()} — ${nc.txt.toLowerCase()})`:''}. [Consolidar a leitura da jornada 30/60/90 e os próximos passos: início do ciclo de desenvolvimento com o diagnóstico de competências.]`};
  }
  const s=scoreDay(k,dd)||{}, it=itensPorNota(k,dd);
  const forcas = it.alto.length? [`${n} se destaca em: ${it.alto.map(x=>x.item.charAt(0).toLowerCase()+x.item.slice(1)).join('; ')}.`] : (s.cls==='Alto'?[`${n} apresenta evolução dentro do esperado para esta fase. [detalhar]`]:[]);
  const grupos={}; [...it.baixo,...it.obs].forEach(x=>{ (grupos[x.obj]=grupos[x.obj]||[]).push(x); });
  const pontos=Object.entries(grupos).map(([obj,arr])=>({titulo:obj,texto:[...new Map(arr.map(x=>[x.item,x])).values()].map(x=>`${x.item}${x.nota?` (${x.nota})`:''}${x.obs?': '+x.obs:''}`).join('. ')+'. [descrever a recomendação]'}));
  return {intro:INTRO[k](n),forcas,pontos,
    visao:`Atingimento de ${s.pct!=null?Math.round(s.pct*100)+'%':'—'} no Day ${ONB[k].n}${s.cls?` — ${s.cls.toLowerCase()} (${s.txt})`:''}. [Consolidar a leitura de GC e o que esperar para o próximo ciclo.]`};

const dcOf=k=>String(k).split('::')[0];
function formsOf(dcId){ return Object.keys(STATE.questoes||{}).filter(k=>k===dcId||k.startsWith(dcId+'::')).sort((a,b)=>(a===dcId?-1:b===dcId?1:a.localeCompare(b,'pt'))); }
function formNome(k){ const q=(STATE.questoes||{})[k]||{}; return k.includes('::')? k.split('::')[1] : (q.nome||'Formulário do ciclo'); }
function compsOf(dcId){ dcId=dcOf(dcId); const g=STATE.diagnostico[dcId]||{tecnicas:[],comportamentais:[]}; return [...g.tecnicas.map(t=>({comp:t,tipo:'T'})),...g.comportamentais.map(t=>({comp:t,tipo:'C'}))]; }
const novaQ=(tipo,comps,titulo)=>({id:'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),tipo,comps:comps||[],titulo:titulo||'',pergunta:'',alt:['','','','']});
function qOf(dcId){ STATE.questoes=STATE.questoes||{}; const dcK=dcId;
  const q=STATE.questoes[dcK]||(STATE.questoes[dcK]={escala:/especialista/i.test(dcK)?'especialista':'padrao',lista:[]});
  if(!q.lista){ q.lista=[]; const it=q.itens||{}; compsOf(dcId).forEach(c=>{ const x=it[c.comp]; if(x&&(x.pergunta||'').trim()) q.lista.push({...novaQ(c.tipo,[c.comp],x.titulo),pergunta:x.pergunta,alt:x.alt}); }); delete q.itens; }
  return q; }
function listaOf(dcId){ const q=qOf(dcId); return [...q.lista.filter(x=>x.tipo==='T'),...q.lista.filter(x=>x.tipo==='C')]; }
function itemPronto(it){ return it.pergunta.trim() && !it.pergunta.trim().startsWith('[') && it.alt.every(a=>a.trim()) && new Set(it.alt.map(a=>a.trim())).size===4; }
function selOf(dcId){ return new Set(compsOf(dcId).map(c=>c.comp)); }
function semQuestao(dcId){ const cob=new Set(listaOf(dcId).flatMap(x=>x.comps)); return compsOf(dcId).filter(c=>!cob.has(c.comp)); }
function statusForm(k){ const q=(STATE.questoes||{})[k]; const cs=compsOf(dcOf(k)); if(!q) return {comps:cs.length,questoes:0,prontas:0,sem:cs.length,ok:false};
  const L=listaOf(k), prontas=L.filter(itemPronto).length, sq=q.origem?0:semQuestao(k).length;
  return {comps:cs.length,questoes:L.length,prontas,sem:sq,ok:L.length>0&&prontas===L.length&&(q.origem?true:cs.length>0&&sq===0)}; }
function statusCargo(dcId){ const fs=formsOf(dcId); if(!fs.length) return {...statusForm(dcId),forms:0}; const st=fs.map(statusForm); const best=st.find(x=>x.ok)||st[0]; return {...best,forms:fs.length,ok:st.some(x=>x.ok)}; }

async function swPDF(p,b){
  const rot=b.textContent; b.disabled=true; b.textContent='Gerando PDF…';
  const fname=`Trilha_de_Desenvolvimento_${p.nome.replace(/\s+/g,'_')}.pdf`;
  try{
    const h2p=await loadLib('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js','html2pdf');
    const wrap=document.createElement('div'); wrap.innerHTML=`<style>${SW_PDF_CSS}</style>`+swDocHTML(p);
    const blob=await h2p().set({margin:[10,11,12,11],filename:fname,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css'],avoid:['h2','h6','.cover','tr','.cc','.sw','.at','.crit','.fz2','.pl','.ck','.ass','.aa','p']}}).from(wrap).outputPdf('blob');
    const pdf=new Blob([blob],{type:'application/pdf'});
    const dl=window.claude&&claude.use? await claude.use('downloads').catch(()=>null) : null;
    if(dl){ await dl.save({filename:fname,data:pdf}); } else { const a=document.createElement('a'); a.href=URL.createObjectURL(pdf); a.download=fname; document.body.appendChild(a); a.click(); a.remove(); }
    toast('PDF gerado');
  }catch(e){ console.error(e); toast('Não foi possível gerar o PDF agora'); }
  b.disabled=false; b.textContent=rot;
}

function formsTitulo(k){ const q=(STATE.questoes||{})[k]||{}; return q.titulo || `Autoavaliação de Competências — ${getDC(dcOf(k)).cargoView}`; }
function formsTexto(dcId){
  const Ls=listaOf(dcId); const L='ABCD';
  const qq=qOf(dcId), rot=qq.rotulos, lab=ESCALAS[qq.escala]||ESCALAS.padrao, bl=qq.blocos||[], nT=Ls.filter(x=>x.tipo==='T').length;
  const op=(a,j)=>rot?`${j+1} – ${lab[j].split(' — ')[0]}: ${a.trim()}`:`${L[j]}. ${a.trim()}`;
  return [formsTitulo(dcId),'',...(qq.intro||[INSTR_FORMS]).flatMap(t=>[t,'']),...Ls.flatMap((it,i)=>{ return [...(bl.length&&i===0?[bl[0],'']:[]),...(bl.length>1&&i===nT?[bl[1],'']:[]),`${i+1}. ${it.pergunta.trim()}`,...it.alt.map(op),'']; })].join('\n');

async function loadLib(src,globalName){ if(window[globalName]) return window[globalName]; await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); return window[globalName]; }
async function gerarDocx(dcId){
  const b=$('#bDocx'); b.disabled=true; b.textContent='Gerando…';

    const JSZip=await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','JSZip');
    const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const para=(t,o={})=>`<w:p><w:pPr>${o.sp?'<w:spacing w:before="240" w:after="60"/>':'<w:spacing w:after="40"/>'}${o.ind?'<w:ind w:left="360"/>':''}</w:pPr><w:r><w:rPr><w:rFonts w:ascii="Montserrat" w:hAnsi="Montserrat"/>${o.b?'<w:b/>':''}<w:sz w:val="${o.sz||22}"/></w:rPr><w:t xml:space="preserve">${x(t)}</w:t></w:r></w:p>`;
    const Ls=listaOf(dcId); const L='ABCD';
    const qq=qOf(dcId), rot=qq.rotulos, lab=ESCALAS[qq.escala]||ESCALAS.padrao, bl=qq.blocos||[], nT=Ls.filter(x=>x.tipo==='T').length;
    let body=para(formsTitulo(dcId),{b:1,sz:32}); (qq.intro||[INSTR_FORMS]).forEach(t=>{ body+=para(t); });
    Ls.forEach((it,i)=>{ if(bl.length&&i===0) body+=para(bl[0],{b:1,sz:26,sp:1}); if(bl.length>1&&i===nT) body+=para(bl[1],{b:1,sz:26,sp:1});
      body+=para(`${i+1}. ${it.pergunta.trim()}`,{b:1,sp:1}); it.alt.forEach((a,j)=>{ body+=para(rot?`${j+1} – ${lab[j].split(' — ')[0]}: ${a.trim()}`:`${L[j]}. ${a.trim()}`,{ind:1}); }); });
    const zip=new JSZip();
    zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
    zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
    zip.file('word/document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`);
    const blob=await zip.generateAsync({type:'uint8array'});
    const dl=window.claude&&claude.use? await claude.use('downloads') : null;
    const fname=`Forms_Autoavaliacao_${(getDC(dcOf(dcId)).cargoView+(dcId.includes('::')?'_'+formNome(dcId):'')).replace(/[^\wÀ-ÿ]+/g,'_')}.docx`;
    if(dl){ await dl.save({filename:fname,data:new Blob([blob],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}); toast('Arquivo gerado'); }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([blob])); a.download=fname; a.click(); }

const normTxt=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
async function importarForms(dcId,file){
  try{
    const XLSX=await loadLib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','XLSX');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    if(!rows.length) throw 0;
    const cs=listaOf(dcId), cols=Object.keys(rows[0]); const oc=allPessoas().filter(p=>p.dc===dcOf(dcId));
    const colNome=cols.find(c=>/nome completo/i.test(c))||cols.find(c=>/^nome$/i.test(c.trim()));
    const pref=(x,y)=>{ let i=0; while(i<x.length&&i<y.length&&x[i]===y[i]) i++; return i; };
    const usados=new Set();
    const colIdx=cs.map(c=>{ const pq=normTxt(c.pergunta); let best=null,bs=0;
      cols.forEach(k=>{ if(usados.has(k)) return; const nk=normTxt(k).replace(/^\d+\s+/,''); const sc=nk===pq?1e6:pref(nk,pq); if(sc>bs){ bs=sc; best=k; } });
      if(bs>=30){ usados.add(best); return best; } return null; });
    let ok=0, nao=[];
    rows.forEach(r=>{
      const nome=normTxt(r[colNome]||r['Nome']||''); const p=oc.find(x=>{ const n=normTxt(x.nome).split(' '); const m=nome.split(' '); return m.length&&m[0]===n[0]&&(m.length===1||n.includes(m[m.length-1])); });
      if(!p){ nao.push(r[colNome]||r['Nome']||'(sem nome)'); return; }
      const notas={};
      cs.forEach((it,i)=>{ const v=normTxt(r[colIdx[i]]); if(!v) return; const v2=v.replace(/^\d\s+(pleno superior|pleno|senior|master|especialista|jr|intermediario)\s+/,''); const j=it.alt.findIndex(a=>{ const na=normTxt(a); return na===v2||na.startsWith(v2.slice(0,50))||v2.startsWith(na.slice(0,50)); }); if(j>=0) notas[it.id]=j+1; });
      const dt=r['Hora de conclusão']||r['Completion time']||new Date(); const d=(dt instanceof Date?dt:new Date(dt));
      STATE.diagRespostas=STATE.diagRespostas||{}; STATE.diagRespostas[p.id]={dc:dcOf(dcId),form:dcId,data:isNaN(d)?new Date().toISOString().slice(0,10):d.toISOString().slice(0,10),origem:'Microsoft Forms',notas}; ok++;
    });
    persist(); renderDiagCargo(dcOf(dcId)); toast(`${ok} resposta(s) importada(s)`+(nao.length?` · não identificado(s): ${nao.join(', ')}`:''));
  }catch(e){ toast('Não consegui ler o arquivo — confira se é o Excel exportado do Forms'); }
}

  if($('#rDel')) $('#rDel').onclick=()=>{ delete STATE.diagRespostas[pid]; persist(); $('#modal').classList.remove('on'); renderDiagCargo(dcOf(dcId)); };
  $('#rSave').onclick=()=>{ STATE.diagRespostas=STATE.diagRespostas||{}; Object.keys(notas).forEach(k=>notas[k]===undefined&&delete notas[k]); STATE.diagRespostas[pid]={dc:dcOf(dcId),form:dcId,data:$('#rData').value,origem:r.origem||'Registro manual',notas}; persist(); $('#modal').classList.remove('on'); renderDiagCargo(dcOf(dcId)); toast('Autoavaliação salva'); };

<script>

  saveState: function(S){

        .then(function(){ return col.doc("base_pessoas").set({json:JSON.stringify(b.pessoas), updatedAt:firebase.firestore.FieldValue.serverTimestamp(), por:userEmail}); });

function carregar(ignorarBackup){
  gate('<h1>Ciclo de Competências</h1><p>Carregando os dados…</p>');
  // desligamentos registrados na Avaliação (config/desligamentos): quem saiu some das listas do ciclo

  }).catch(function(){ window.CICLO_DESLIG = []; }).then(function(){ return col.get(); }).then(function(qs){

    el("ugm-pessoas").textContent = docs.base_pessoas ? docs.base_pessoas.json : "[]";
    el("ugm-state").textContent = JSON.stringify(S);
    el("gate").style.display = "none"; el("appwrap").style.display = "";
    var s = document.createElement("script"); s.textContent = el("app-code").textContent; document.body.appendChild(s);
    var foot = document.querySelector(".side .foot");
    if(foot){ var a = document.createElement("a"); a.className="backlink"; a.href="./"; a.textContent="← Avaliação de Desempenho e PDI"; foot.appendChild(a);
      var b = document.createElement("a"); b.className="backlink"; b.href="#"; b.textContent="Sair ("+userEmail+")"; b.onclick=function(e){ e.preventDefault(); firebase.auth().signOut().then(function(){ location.reload(); }); }; foot.appendChild(b); }
  }).catch(function(e){
    console.error(e);
    if(e && e.code==="permission-denied") return telaSemAcesso();
    gate('<h1>Não foi possível carregar</h1><div class="err">'+h(e.code||e.message)+'</div><p><button class="btn" onclick="location.reload()">Tentar de novo</button></p>');
  });
}

firebase.auth().onAuthStateChanged(function(u){
  if(!u) return telaLogin();
  userEmail = (u.email || (u.providerData[0]||{}).email || "").toLowerCase();
  window.CICLO_USER = userEmail;
  if(RH_EMAILS.indexOf(userEmail) === -1) return telaSemAcesso();
  carregar(false);
});
})();
</script>
